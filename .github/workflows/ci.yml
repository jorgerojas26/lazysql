---
name: Continuous Integration

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # `,direct` only falls back for 404/410 responses. Use `|direct` so
      # transient proxy errors (such as HTTP/2 stream failures) also fall
      # back to fetching the module from its source repository.
      GOPROXY: "https://proxy.golang.org|direct"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Golangci-lint
        # v7 is the first action major that supports golangci-lint v2
        uses: golangci/golangci-lint-action@v7
        with:
          # the config is in the v2 format (version: "2", formatters section);
          # v1 (default "latest" resolution) rejects it in `config verify`
          version: v2.12.2

      - name: Test
        run: go test -v ./...

      - name: Network performance contract
        run: >-
          go test ./components ./drivers ./app ./helpers ./helpers/logger ./internal/benchmarks
          -run
          'Test(FetchRecords|PaginationUsesPageFetchOnlyAfterMetadataIsCached|AutomaticCount|ManualExactCount|Metadata|Stale|EditorStream|CancelActiveQuery|Export|CanExport|ReplaySafe|SuccessfulEditorDDL|EditorDML|SQLiteStream|ExactRowCount|SQLiteGetRecords|MySQL_GetForeignKeys|ApplyConnectionPool|ConnectionPool|CSVWriter|SchemaLoader|PerformanceKeybindings|DebugPerformance|Scenario|Harness|ParseRTTs)'

      - name: Build
        run: go build -v ./...
